name: PowerShell Lint (PSScriptAnalyzer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell Linter
        shell: pwsh
        run: |
          # 1. Garante a instalação do PSScriptAnalyzer
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }

          # 2. Autocorreção: Converte o encoding de todos os arquivos .ps1 e .psm1 para UTF-8
          $files = Get-ChildItem -Path . -Include *.ps1, *.psm1 -Recurse
          foreach ($file in $files) {
              $content = Get-Content -Path $file.FullName -Raw
              [System.IO.File]::WriteAllText($file.FullName, $content, [System.Text.Encoding]::UTF8)
          }

          # 3. Lista de regras estéticas e formais ignoradas para focar no que é funcional
          $excludedRules = @(
              'PSAvoidUsingCmdletAliases',
              'PSProvideCommentHelp',
              'PSUseDeclaredVarsMoreThanAssignments',
              'PSUseApprovedVerbs',
              'PSAlignAssignmentStatement',
              'PSUseConsistentWhitespace',
              'PSUseConsistentIndentation',
              'PSPlaceOpenBrace',
              'PSPlaceCloseBrace'
          )

          # 4. Análise direcionada às pastas do projeto
          $pathsToAnalyze = @(
              './modules/ps5',
              './modules/ps7',
              './orquestrador'
          )

          $issuesFound = $false

          foreach ($path in $pathsToAnalyze) {
              if (Test-Path $path) {
                  Write-Host "--- Analisando diretório: $path ---" -ForegroundColor Cyan
                  
                  $results = Invoke-ScriptAnalyzer -Path $path -Recurse -ExcludeRule $excludedRules | 
                      Where-Object { $_.Severity -eq 'Error' -or $_.Severity -eq 'Warning' }

                  if ($results) {
                      $issuesFound = $true
                      $results | Format-Table -Property ScriptPath, Line, Severity, Message -AutoSize
                  } else {
                      Write-Host "Nenhum erro ou aviso funcional encontrado em $path." -ForegroundColor Green
                  }
              } else {
                  Write-Host "Caminho $path não encontrado." -ForegroundColor Yellow
              }
          }

          # 5. Falha o job caso haja erros funcionais ou avisos críticos
          if ($issuesFound) {
              Write-Error "Foram encontradas inconsistências funcionais no PowerShell. Verifique o log acima."
              exit 1
          }
