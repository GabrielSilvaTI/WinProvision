name: PowerShell Lint (PSScriptAnalyzer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache módulos do PowerShell
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-PSScriptAnalyzer

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Normalizar codificação para UTF-8 com BOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          $files = Get-ChildItem -Path . -Include *.ps1, *.psm1, *.psd1 -Recurse -File
          foreach ($file in $files) {
              $content = Get-Content -Path $file.FullName -Raw
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8Bom)
          }

      - name: Executar análise de lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Regras estéticas, formais e convenções ignoradas
          $excludedRules = @(
              'PSAvoidUsingCmdletAliases',
              'PSProvideCommentHelp',
              'PSUseDeclaredVarsMoreThanAssignments',
              'PSUseApprovedVerbs',
              'PSAlignAssignmentStatement',
              'PSUseConsistentWhitespace',
              'PSUseConsistentIndentation',
              'PSPlaceOpenBrace',
              'PSPlaceCloseBrace',
              'PSPossibleIncorrectUsageOfAssignmentOperator',
              'PSAvoidGlobalVars',
              'PSAvoidUsingWMICmdlet',
              'PSAvoidUsingWriteHost',
              'PSUseShouldProcessForStateChangingFunctions',
              'PSUseSingularNouns',
              'PSUseBOMForUnicodeEncodedFile'
          )

          # Diretórios do projeto
          $pathsToAnalyze = @(
              './modules/ps5',
              './modules/ps7',
              './orquestrador'
          )

          $workspaceRoot = (Get-Location).Path
          $issuesFound = $false

          foreach ($path in $pathsToAnalyze) {
              if (-not (Test-Path $path)) {
                  Write-Host "Diretório não encontrado, pulando: $path" -ForegroundColor DarkGray
                  continue
              }

              Write-Host "=== Analisando diretório: $path ===" -ForegroundColor Cyan

              [string[]]$targetFiles = (Get-ChildItem -Path $path -Include *.ps1, *.psm1, *.psd1 -Recurse -File).FullName

              if ($targetFiles.Count -eq 0) {
                  Write-Host "Nenhum arquivo PowerShell encontrado em $path." -ForegroundColor DarkGray
                  continue
              }

              $results = $targetFiles |
                  ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -ExcludeRule $excludedRules } |
                  Where-Object { $_.Severity -eq 'Error' -or $_.Severity -eq 'Warning' }

              if (-not $results) {
                  Write-Host "Nenhum erro ou aviso funcional em $path." -ForegroundColor Green
                  continue
              }

              $issuesFound = $true
              foreach ($issue in $results) {
                  $logType = if ($issue.Severity -eq 'Error') { 'error' } else { 'warning' }
                  $relativePath = [System.IO.Path]::GetRelativePath($workspaceRoot, $issue.ScriptPath)

                  Write-Host "::$logType file=$relativePath,line=$($issue.Line),col=$($issue.Column)::[$($issue.RuleName)] $($issue.Message)"
                  Write-Host "[$($issue.Severity)] $($relativePath): L$($issue.Line) - $($issue.Message)" -ForegroundColor Red
                  Write-Host "    Regra: $($issue.RuleName)" -ForegroundColor Yellow
                  Write-Host "----------------------------------------------------"
              }
          }

          if ($issuesFound) {
              Write-Error "Foram encontradas inconsistências funcionais no código. Verifique as anotações no repositório."
              exit 1
          }
