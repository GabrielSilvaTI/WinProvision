name: PowerShell Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'orquestrador/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'orquestrador/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Prepare PowerShell Gallery and Install PSScriptAnalyzer
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072 -bor 12288
          if (-not (Get-PSRepository -Name "PSGallery" -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default -ErrorAction SilentlyContinue
          }
          Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Fix Encoding UTF-8 with BOM & Run PSScriptAnalyzer
        shell: powershell
        run: |
          $targetFolders = @("modules", "orquestrador")
          $extensions    = @("*.ps1", "*.psm1", "*.psd1")

          # 1. Ajusta o encoding UTF-8 com BOM em todos os diretórios e extensões alvo
          foreach ($folder in $targetFolders) {
              if (Test-Path $folder) {
                  Get-ChildItem -Path $folder -Include $extensions -Recurse | ForEach-Object {
                      $Content = Get-Content -Path $_.FullName -Raw
                      if ($Content) {
                          $Content | Out-File -FilePath $_.FullName -Encoding utf8 -Force
                      }
                  }
              }
          }

          # 2. Executa o linter apontando para o manifesto PSScriptAnalyzerSettings.psd1
          $settingsPath = ".\.github\PSScriptAnalyzerSettings.psd1"
          [array]$issues = @()

          foreach ($folder in $targetFolders) {
              if (Test-Path $folder) {
                  if (Test-Path $settingsPath) {
                      $issues += Invoke-ScriptAnalyzer -Path $folder -Recurse -Settings $settingsPath
                  } else {
                      # Fallback de segurança caso o arquivo de settings não exista
                      $issues += Invoke-ScriptAnalyzer -Path $folder -Recurse -ExcludeRule @('PSUseBOM', 'PSAvoidUsingCmdletAliases', 'PSUseCorrectCasing') -Severity Error, Warning
                  }
              }
          }

          # 3. Reporta os problemas encontrados
          if ($issues.Count -gt 0) {
              foreach ($issue in $issues) {
                  Write-Output "[$($issue.Severity)] No arquivo: $($issue.ScriptName) (Linha $($issue.Line)): $($issue.Message) [Regra: $($issue.RuleName)]"
              }
              Write-Error "Foram encontrados problemas no codigo listados acima."
              exit 1
          } else {
              Write-Host "✅ Análise concluída sem erros em 'modules/' e 'orquestrador/'." -ForegroundColor Green
          }

      - name: Auto-commit das Correções de Encoding UTF-8
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(powershell): aplica encoding UTF-8 com BOM nos scripts"
          file_pattern: "modules/** orquestrador/**"
