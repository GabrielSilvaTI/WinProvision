name: PowerShell Lint (PSScriptAnalyzer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell Linter
        shell: pwsh
        run: |
          # 1. Garante a instalação do PSScriptAnalyzer
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }

          # 2. Autocorreção: Converte o encoding de todos os arquivos para UTF-8 (Sem BOM)
          $files = Get-ChildItem -Path . -Include *.ps1, *.psm1, *.psd1 -Recurse
          foreach ($file in $files) {
              $content = Get-Content -Path $file.FullName -Raw
              [System.IO.File]::WriteAllText($file.FullName, $content, (New-Object System.Text.UTF8Encoding $false))
          }

          # 3. Exclui regras puramente estéticas, estilísticas ou de sugestões não-críticas
          $excludedRules = @(
              'PSAvoidUsingCmdletAliases',
              'PSProvideCommentHelp',
              'PSUseDeclaredVarsMoreThanAssignments',
              'PSUseApprovedVerbs',
              'PSAlignAssignmentStatement',
              'PSUseConsistentWhitespace',
              'PSUseConsistentIndentation',
              'PSPlaceOpenBrace',
              'PSPlaceCloseBrace',
              'PSPossibleIncorrectUsageOfAssignmentOperator',
              'PSAvoidGlobalVars',
              'PSAvoidUsingWMICmdlet'
          )

          # 4. Diretórios do projeto
          $pathsToAnalyze = @(
              './modules/ps5',
              './modules/ps7',
              './orquestrador'
          )

          $issuesFound = $false

          foreach ($path in $pathsToAnalyze) {
              if (Test-Path $path) {
                  Write-Host "=== Analisando diretório: $path ===" -ForegroundColor Cyan
                  
                  # Captura os resultados
                  $results = Invoke-ScriptAnalyzer -Path $path -Recurse -ExcludeRule $excludedRules | 
                      Where-Object { $_.Severity -eq 'Error' -or $_.Severity -eq 'Warning' }

                  if ($results) {
                      $issuesFound = $true

                      foreach ($issue in $results) {
                          # Formatação em formato de Annotation nativo do GitHub Actions
                          $logType = if ($issue.Severity -eq 'Error') { 'error' } else { 'warning' }
                          Write-Host "::$logType file=$($issue.ScriptPath),line=$($issue.Line),col=$($issue.Column)::[$($issue.RuleName)] $($issue.Message)"
                          
                          # Detalhe legível e sem cortes no log do console
                          Write-Host "[$($issue.Severity)] $($issue.ScriptName): L$($issue.Line) - $($issue.Message)" -ForegroundColor Red
                          Write-Host "    Regra: $($issue.RuleName)" -ForegroundColor Yellow
                          Write-Host "----------------------------------------------------"
                      }
                  } else {
                      Write-Host "Nenhum erro ou aviso funcional em $path." -ForegroundColor Green
                  }
              }
          }

          # 5. Interrompe a execução caso encontre Erros ou Warnings funcionais
          if ($issuesFound) {
              Write-Error "Foram encontradas inconsistências funcionais no código. Verifique as anotações no repositório."
              exit 1
          }
