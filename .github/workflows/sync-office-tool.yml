name: Sync Office Tool Plus Fallback

on:
  schedule:
    - cron: '0 4 * * *' # Executa diariamente às 04:00 UTC
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  update-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Corrige o encoding de arquivos .ps1 com UTF-8 BOM para evitar falhas no Git
      - name: Corrigir Encoding dos Arquivos PowerShell
        run: |
          find . -type f -name "*.ps1" -exec sed -i '1s/^\xEF\xBB\xBF//' {} +

      - name: Buscar Última Release do Office Tool Plus
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtém a tag da última versão (ex: v11.6.6.0)
          LATEST_TAG=$(gh release view --repo YerongAI/Office-Tool --json tagName -q .tagName)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          
          # Remove o 'v' inicial para extrair apenas a numeração da versão
          VERSION=${LATEST_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Monta o nome exato do arquivo zip com runtime x64
          FILE_NAME="Office_Tool_with_runtime_v${VERSION}_x64.zip"
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV

      - name: Garantir existência do arquivo de manifesto e verificar versão
        run: |
          # Cria o diretório 'config' caso não exista
          mkdir -p config

          # Se o manifesto não existir, cria com estrutura JSON inicial válida
          if [ ! -f config/manifest.json ]; then
            echo "{}" > config/manifest.json
          fi

          # Lê a versão atual registrada no manifesto
          CURRENT_VERSION=$(jq -r '.office_tool.version // ""' config/manifest.json)

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "NEW_VERSION_NEEDED=true" >> $GITHUB_ENV
            echo "Nova versão detectada: $VERSION (Versão atual no manifesto: '$CURRENT_VERSION')"
          else
            echo "NEW_VERSION_NEEDED=false" >> $GITHUB_ENV
            echo "A versão no fallback já é a mais recente ($VERSION)."
          fi

      - name: Baixar o Zip e Atualizar Fallback
        if: env.NEW_VERSION_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./downloads
          
          # Baixa o arquivo exato da release no YerongAI/Office-Tool
          gh release download ${{ env.LATEST_TAG }} \
            --repo YerongAI/Office-Tool \
            --pattern "${{ env.FILE_NAME }}" \
            --dir ./downloads

          # Calcula o Hash SHA256 do arquivo baixado
          HASH=$(sha256sum ./downloads/${{ env.FILE_NAME }} | awk '{print $1}')
          
          echo "Arquivo baixado com sucesso."
          echo "SHA256: $HASH"

          # Atualiza ou insere as informações do Office Tool Plus no manifesto
          jq --arg ver "$VERSION" \
             --arg tag "$LATEST_TAG" \
             --arg file "$FILE_NAME" \
             --arg sha "$HASH" \
             '.office_tool = {
                version: $ver,
                tag: $tag,
                filename: $file,
                download_url: ("https://github.com/YerongAI/Office-Tool/releases/download/" + $tag + "/" + $file),
                sha256: $sha,
                updated_at: (now | strftime("%Y-%m-%d %H:%M:%SZ"))
              }' \
             config/manifest.json > config/manifest.tmp.json

          mv config/manifest.tmp.json config/manifest.json

      - name: Commit e Push do Manifesto
        if: env.NEW_VERSION_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(fallback): atualiza Office Tool Plus para a versão ${{ env.VERSION }}"
          file_pattern: "config/manifest.json"
