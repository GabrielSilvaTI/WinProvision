name: Sync Office Tool Plus Fallback

on:
  schedule:
    - cron: '0 4 * * *' # Executa diariamente às 04:00 UTC
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  update-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Buscar Última Release do Office Tool Plus
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtém a tag da última versão (ex: v11.6.6.0)
          LATEST_TAG=$(gh release view --repo YerongAI/Office-Tool --json tagName -q .tagName)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          
          # Remove o 'v' inicial se necessário para bater com o nome do arquivo
          VERSION=${LATEST_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Monta o nome exato do arquivo desejado
          FILE_NAME="Office_Tool_with_runtime_v${VERSION}_x64.zip"
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV

      - name: Verificar se há atualização pendente
        run: |
          # Lê a versão atualmente registrada no seu manifesto local
          CURRENT_VERSION=$(jq -r '.office_tool.version // ""' config/manifest.json 2>/dev/null || echo "")

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "NEW_VERSION_NEEDED=true" >> $GITHUB_ENV
            echo "Nova versão detectada: $VERSION (Versão atual: $CURRENT_VERSION)"
          else
            echo "NEW_VERSION_NEEDED=false" >> $GITHUB_ENV
            echo "A versão no fallback já é a mais recente ($VERSION)."
          fi

      - name: Baixar o Zip e Atualizar Fallback
        if: env.NEW_VERSION_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./downloads
          
          # Baixa o asset exato da release no YerongAI/Office-Tool
          gh release download ${{ env.LATEST_TAG }} \
            --repo YerongAI/Office-Tool \
            --pattern "${{ env.FILE_NAME }}" \
            --dir ./downloads

          # Calcula o Hash SHA256 do arquivo baixado
          HASH=$(sha256sum ./downloads/${{ env.FILE_NAME }} | awk '{print $1}')
          
          echo "Arquivo baixado com sucesso."
          echo "SHA256: $HASH"

          # -------------------------------------------------------------
          # AQUI VOCÊ PODE ENVIAR O .ZIP PARA O SEU STORAGE DE FALLBACK
          # Exemplo para AWS S3:
          # aws s3 cp ./downloads/${{ env.FILE_NAME }} s3://meu-bucket-winprovision/office-tool/Office_Tool_x64_latest.zip
          # -------------------------------------------------------------

          # Atualiza o manifesto do WinProvision com a versão, nome do arquivo e hash
          mkdir -p config
          jq --arg ver "$VERSION" \
             --arg tag "$LATEST_TAG" \
             --arg file "$FILE_NAME" \
             --arg sha "$HASH" \
             '.office_tool = {version: $ver, tag: $tag, filename: $file, sha256: $sha, updated_at: (now | strftime("%Y-%m-%d %H:%M:%SZ"))}' \
             config/manifest.json > config/manifest.tmp.json
          mv config/manifest.tmp.json config/manifest.json

      - name: Commit do Manifesto Atualizado
        if: env.NEW_VERSION_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(fallback): atualiza Office Tool Plus para a versão ${{ env.VERSION }}"
