name: Estrutura do Repositório

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  report-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Gerar Árvore do Repositório
        run: |
          echo "=== ESTRUTURA DO REPOSITÓRIO ===" > tree_report.txt
          npx tree-node --ignore .git >> tree_report.txt
          cat tree_report.txt

      - name: Salvar Relatório como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: estrutura-repositorio
          path: tree_report.txt
