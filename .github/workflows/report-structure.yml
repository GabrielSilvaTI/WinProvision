name: Estrutura do Repositório

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  report-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Gerar Árvore do Repositório
        run: |
          python3 -c "
          import os

          def print_tree(startpath):
              output = ['=== ESTRUTURA DO REPOSITÓRIO ===\n']
              for root, dirs, files in os.walk(startpath):
                  # Ignora a pasta .git
                  if '.git' in dirs:
                      dirs.remove('.git')
                  
                  level = root.replace(startpath, '').count(os.sep)
                  indent = '│   ' * (level)
                  output.append(f'{indent}├── {os.path.basename(root)}/')
                  subindent = '│   ' * (level + 1)
                  for f in files:
                      output.append(f'{subindent}├── {f}')
              return '\n'.join(output)

          report = print_tree('.')
          print(report)
          with open('tree_report.txt', 'w', encoding='utf-8') as f:
              f.write(report)
          "

      - name: Salvar Relatório como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: estrutura-repositorio
          path: tree_report.txt
